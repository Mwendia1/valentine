<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    h1 {
      margin-bottom: 20px;
    }

    .bunny {
      font-size: 80px;
      transition: transform 0.4s ease;
      margin: 20px 0;
      animation: adorableBounce 2s ease-in-out infinite;
    }

    @keyframes adorableBounce {
      0%, 100% { 
        transform: translateY(0) scale(1) rotate(0deg);
      }
      25% { 
        transform: translateY(-8px) scale(1.05) rotate(-2deg);
      }
      50% { 
        transform: translateY(-12px) scale(1.1) rotate(0deg);
      }
      75% { 
        transform: translateY(-8px) scale(1.05) rotate(2deg);
      }
    }

    .bunny-excited {
      animation: superExcited 1s ease-in-out;
    }

    @keyframes superExcited {
      0% { transform: scale(1) rotate(0deg); }
      10% { transform: scale(1.3) rotate(-15deg); }
      20% { transform: scale(0.9) rotate(15deg); }
      30% { transform: scale(1.4) rotate(-10deg); }
      40% { transform: scale(0.8) rotate(10deg); }
      50% { transform: scale(1.5) rotate(-5deg); }
      60% { transform: scale(0.9) rotate(5deg); }
      70% { transform: scale(1.2) rotate(-3deg); }
      80% { transform: scale(1.1) rotate(3deg); }
      90% { transform: scale(1.05) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .heart-particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: float-up 2s ease-out forwards;
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.2);
      }
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 20px;
      position: relative;
    }

    .btn-box {
      flex: 1;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      z-index: 10;
      position: relative;
    }

    #noBtn {
      background: #ccc;
      z-index: 5;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #yesBtn:hover {
      background: #ff3355;
    }

    #noBtn:hover {
      background: #bbb;
    }
      

    .bunny-still {
      animation: none !important;
    }
    #letterBtn {
      background: #ff9a56;
      color: white;
      margin-top: 15px;
      width: 100%;
    }

    #letterBtn:hover {
      background: #ff8533;
    }

    .love-letter {
      background: #fff9f0;
      border: 2px solid #ff4d6d;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      font-style: italic;
      color: #333;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    @media (max-width: 480px) {
      .card {
        padding: 20px 15px;
        margin: 10px;
      }
      
      h1 {
        font-size: 1.3rem;
      }
      
      .bunny {
        font-size: 60px;
      }
      
      .buttons {
        gap: 15px;
        flex-direction: column;
      }
      
      .btn-box {
        width: 100%;
      }
      
      button {
        padding: 18px;
        font-size: 18px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>

    <div id="bunny" class="bunny">🐰💕</div>

    <div class="buttons">
      <div class="btn-box">
        <button id="yesBtn">Yes 💖</button>
      </div>
      <div class="btn-box">
        <button id="noBtn">No 😢</button>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const bunny = document.getElementById("bunny");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    let yesScale = 1;
    let move = 0;
    let textIndex = 0;

    const noTexts = [
      "Are you sure? 🥺",
      "Think again 😭",
      "Pleaseee 💔",
      "Please say yes! 🙏",
      "Why not? 😞",
      "I need you! 😢",
      "Don't break my heart 😢",
      "Last chance 😳",
      "I promise I'll be good! 😇",
      "give me a chance! 🙏",
      "Please? 🥺"
    ];

    function createHeartParticle() {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.textContent = '💖';
      heart.style.left = Math.random() * 200 + 'px';
      heart.style.top = '50px';
      document.querySelector('.card').appendChild(heart);
      
      setTimeout(() => heart.remove(), 2000);
    }

    noBtn.addEventListener("click", () => {
      // Bunny excited animation
      bunny.classList.add('bunny-excited');
      setTimeout(() => bunny.classList.remove('bunny-excited'), 800);
      
      // Move bunny
      move += 40;
      bunny.style.transform = `translateX(${move}px)`;

      // Grow yes button
      yesScale += 0.25;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Change no button text
      noBtn.textContent = noTexts[textIndex % noTexts.length];
      textIndex++;
      
      // Create heart particles
      createHeartParticle();
    });

    yesBtn.addEventListener("click", () => {
      bunny.classList.add('bunny-still');
      // Keep bunny at current position
      bunny.style.transform = `translateX(${move}px)`;
      document.querySelector('.buttons').style.display = 'none';
      bunny.textContent = "🐰💖";
      message.innerHTML = "<div class='success'>Yaaay! I love you so much❤️</div>";
      
      // Celebration hearts
      for(let i = 0; i < 5; i++) {
        setTimeout(() => createHeartParticle(), i * 200);
      }
      
      // Redirect to celebration page after 2 seconds
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 2000);
    });
  </script>

</body>
</html>
